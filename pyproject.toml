[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lattice"
version = "0.1.0"
description = "Суррогатное моделирование связанной термо-механо-деградационной задачи"
readme = "README.md"
# 3.12 — штатная версия Ubuntu 24.04, целевой платформы расчёта и деплоя.
# Стабы numpy 2.5 используют оператор `type`, который ниже 3.12 не разбирается.
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-fem>=10.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "typer>=0.15",
    # Алгебраический многосеточный предобуславливатель. Замерено: прямое решение
    # 0.83 с против 0.11 с у CG+AMG на сетке 129×129 — без него прокат до отказа
    # не укладывается в бюджет генерации датасета.
    "pyamg>=5.3",
]

[project.optional-dependencies]
# Хранилище датасетов. Отделено, чтобы верификация солвера ставилась без Zarr/Arrow.
data = [
    "zarr>=3.0",
    "pyarrow>=18.0",
    "polars>=1.0",
]
# ML-контур. На Windows-машине разработки не нужен: обучение идёт на Ubuntu.
ml = [
    "torch>=2.5",
    "neuraloperator>=1.0",
]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "hypothesis>=6.120",
    "ruff>=0.8",
    "mypy>=1.13",
    # Метод искусственных решений: правая часть выводится символьно из выбранного
    # точного решения. Ручной вывод здесь опаснее отсутствия проверки — ошибка
    # в выкладке даёт зелёную верификацию неверного солвера.
    "sympy>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lattice"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "N",           # pep8-naming
    "UP",          # pyupgrade
    "B",           # bugbear
    "SIM",         # simplify
    "RUF",         # ruff-specific
    "NPY",         # numpy-specific
    "PL",          # pylint
    "TID",         # tidy-imports
]
ignore = [
    # Однобуквенные имена в численном коде — это E, nu, K, f из формул, а не небрежность.
    # N806 требует строчных локальных имён, но модуль Юнга в литературе называется E,
    # и переименование в `e` делает код труднее сверять с выкладкой, а не легче.
    "E741",
    "N806",
    "PLR0913",  # много аргументов: у физических функций это нормально
    "PLR2004",  # магические числа в тестах-сравнениях
    # Документация и комментарии ведутся по-русски. Правила «неоднозначных юникод-символов»
    # ловят каждую кириллическую «а» и «с» как опечатку в латинице — для этого проекта
    # это сплошной шум, перекрывающий настоящие находки.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["lattice"]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["skfem.*", "scipy.*", "zarr.*", "neuraloperator.*", "sympy.*", "pyamg.*"]
ignore_missing_imports = true

# scikit-fem не поставляет типовую информацию, поэтому декораторы форм
# (@BilinearForm, @LinearForm, @Functional) стирают типы обёрнутых функций.
# Послабление ограничено слоем, который вообще имеет право звать skfem, и снимает
# ровно два правила; всё остальное — включая обязательные аннотации — остаётся
# под strict. Остальной проект не затронут.
[[tool.mypy.overrides]]
module = ["lattice.solver.*", "tests.verification.*"]
disallow_untyped_decorators = false
warn_return_any = false

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
markers = [
    "slow: тесты дольше ~5 с (сеточная сходимость, прогоны до отказа)",
    "verification: набор верификации — MMS, Кирш, аналитика KR",
]

# ---------------------------------------------------------------------------
# Coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["src/lattice"]

[tool.coverage.report]
# Порог 80% меряется по физике/суррогату/движку/API, не по коду построения графиков.
omit = [
    "src/lattice/bench/report.py",
    "src/lattice/*/cli.py",
]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
